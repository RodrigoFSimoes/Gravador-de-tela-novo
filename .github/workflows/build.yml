
name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $exe = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg.exe

      - name: Gerar EXE
        shell: pwsh
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name GravadorCompacto main.py
          New-Item -ItemType Directory -Path pacote | Out-Null
          Copy-Item dist/GravadorCompacto.exe pacote/
          Copy-Item ffmpeg.exe pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: GravadorCompacto
          path: pacote/
